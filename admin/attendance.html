<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance Manager — GEN Z Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="seal">EH</span> GEN Z</div>
    <div class="mb-3 px-1"><span class="admin-badge"><i class="fa-solid fa-user-shield"></i> Admin</span></div>
    <div class="nav-section-label">Overview</div>
    <a href="index.html" class="side-link"><i class="fa-solid fa-gauge"></i> Admin Dashboard</a>
    <div class="nav-section-label">Manage</div>
    <a href="students.html" class="side-link"><i class="fa-solid fa-users"></i> Students</a>
    <a href="attendance.html" class="side-link active"><i class="fa-solid fa-calendar-check"></i> Attendance</a>
    <div class="nav-section-label">Account</div>
    <a href="../index.html" class="side-link"><i class="fa-solid fa-arrow-left"></i> Back to Site</a>
    <a href="#" class="side-link" id="logoutLink"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-outline-secondary sidebar-toggle-btn" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
        <div>
          <div class="fw-semibold" style="font-family:'Fraunces',serif;">Attendance Manager</div>
          <div class="small text-secondary">Update per-subject attendance for any student</div>
        </div>
      </div>
      <div class="avatar-circle" id="avatarInit">--</div>
    </div>

    <div class="page-body">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="panel">
            <div class="panel-header"><h3>Portal Overview</h3></div>
            <div class="panel-body">
              <p class="small text-secondary mb-3">Students below the 75% requirement, lowest first.</p>
              <div id="overviewList"></div>
            </div>
          </div>
        </div>

        <div class="col-lg-8">
          <div class="panel">
            <div class="panel-header">
              <h3>Update Attendance</h3>
              <select class="form-control form-select" id="studentSelect" style="max-width:280px;"></select>
            </div>
            <div class="panel-body">
              <div id="editorAlert"></div>
              <div id="attendanceEditor"></div>
              <button class="btn btn-gold mt-3" id="saveAttendanceBtn"><i class="fa-solid fa-floppy-disk me-2"></i>Save Changes</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/admin-attendance.js"></script>
</body>
</html>
