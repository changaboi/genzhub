# Apache virtual host for http://studenthub.local   (Practical 15, intermediate extension)
# XAMPP on Windows:  copy this block into  C:\xampp\apache\conf\extra\httpd-vhosts.conf
# and make sure httpd.conf contains:       Include conf/extra/httpd-vhosts.conf
# Edit the paths below to where you extracted the project.

<VirtualHost *:80>
    ServerName studenthub.local
    DocumentRoot "C:/xampp/htdocs/studenthub"

    <Directory "C:/xampp/htdocs/studenthub">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php
    </Directory>

    # keep private folders private even if .htaccess is ignored
    <DirectoryMatch "^C:/xampp/htdocs/studenthub/(includes|storage|tests|deploy|database)">
        Require all denied
    </DirectoryMatch>

    # optional environment overrides (use a dedicated MySQL user in production)
    # SetEnv STUDENTHUB_DB_USER studenthub_app
    # SetEnv STUDENTHUB_DB_PASSWORD change-me

    ErrorLog  "logs/studenthub-error.log"
    CustomLog "logs/studenthub-access.log" combined
</VirtualHost>
