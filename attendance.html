<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance — EduHub Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="seal">EH</span> EduHub</div>
    <div class="nav-section-label">Main</div>
    <a href="dashboard.html" class="side-link"><i class="fa-solid fa-gauge"></i> Dashboard</a>
    <a href="marks.html" class="side-link"><i class="fa-solid fa-graduation-cap"></i> Marks</a>
    <a href="attendance.html" class="side-link active"><i class="fa-solid fa-calendar-days"></i> Attendance</a>
    <a href="results.html" class="side-link"><i class="fa-solid fa-file-circle-check"></i> Results</a>
    <div class="nav-section-label">Account</div>
    <a href="profile.html" class="side-link"><i class="fa-solid fa-id-card"></i> Profile</a>
    <a href="#" class="side-link" id="logoutLink"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-sm btn-outline-secondary sidebar-toggle-btn" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
        <div>
          <div class="fw-semibold" style="font-family:'Fraunces',serif;">Attendance</div>
          <div class="small text-secondary">Subject-wise attendance percentage</div>
        </div>
      </div>
      <div class="avatar-circle" id="avatarInit">--</div>
    </div>

    <div class="page-body">
      <div class="row g-4 mb-4">
        <div class="col-lg-4">
          <div class="panel h-100 p-4 text-center">
            <p class="eyebrow mb-3">Overall</p>
            <div class="donut" id="donut">
              <div class="donut-inner">
                <div class="val" id="donutVal">--%</div>
                <div class="lbl">Attended</div>
              </div>
            </div>
            <p class="small text-secondary mt-3 mb-0" id="donutNote">Minimum required: 75%</p>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="panel h-100">
            <div class="panel-header"><h3>Attendance Alerts</h3></div>
            <div class="panel-body" id="alertList">
              <p class="text-secondary small mb-0">No shortages — great job staying consistent!</p>
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header"><h3>Subject-wise Attendance</h3></div>
        <div class="panel-body" id="attendanceRows"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/attendance.js"></script>
</body>
</html>
